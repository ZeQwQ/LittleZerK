name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard inflate64

      - name: Build with Nuitka (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m nuitka --standalone --follow-imports --output-filename=agent.exe agent.py

      - name: Build with Nuitka (Unix)
        if: matrix.platform != 'windows'
        run: |
          python -m nuitka --standalone --follow-imports --output-filename=agent agent.py

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $targetDir = "dist/littlezerk/bin/${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -Path agent.dist/* -Destination $targetDir -Recurse
          Compress-Archive -Path dist/littlezerk -DestinationPath dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.zip

      - name: Create archive (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          targetDir="dist/littlezerk/bin/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$targetDir"
          cp -r agent.dist/* "$targetDir/"
          tar -czvf dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C dist littlezerk

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          files: dist/littlezerk-*.tar.gz dist/littlezerk-*.zip
          generate_release_notes: true
