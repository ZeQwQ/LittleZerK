name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard inflate64

      - name: Build with Nuitka
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            python -m nuitka --standalone --follow-imports --output-filename=agent.exe agent.py
          else
            python -m nuitka --standalone --follow-imports --output-filename=agent agent.py
          fi

      - name: Create archive
        shell: bash
        run: |
          cd agent.dist
          if [ "${{ matrix.platform }}" == "windows" ]; then
            powershell Compress-Archive -Path * -DestinationPath ../littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.zip
          else
            tar -czvf ../littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz *
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          files: littlezerk-*.tar.gz littlezerk-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
