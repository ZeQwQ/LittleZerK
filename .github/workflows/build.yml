name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传二进制的 Release 标签，例如 v0.5.4'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 手动触发时用输入的 tag，推送 tag 触发时用 ref_name
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 先把 Release 建好，各平台再并行上传，避免多个 job 同时
  # "读 release → 追加资产" 互相撞车
  # ─────────────────────────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 这个 job 没有 checkout，工作目录不是 git 仓库，
          # gh 无法自动推断仓库，必须显式 --repo
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，跳过创建"
          else
            echo "创建 Release $RELEASE_TAG（tag 不存在时按当前提交自动创建）"
            if ! gh release create "$RELEASE_TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "小小泽 $RELEASE_TAG" --generate-notes; then
              # 并发创建导致的冲突：只要 Release 最终存在就算成功
              gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1 && echo "Release 已存在，继续" || exit 1
            fi
          fi

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 是 Apple Silicon，Intel 需要用不带 -arm64 后缀的标签
          # （macos-13 已下线，现存 macos-14 / macos-15 / macos-26 均为 Intel）
          - os: macos-15
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade nuitka ordered-set zstandard inflate64

      # 依赖包名各环境可能不同（httpx/httpx2 等），运行时探测再生成编译参数
      - name: Prepare Nuitka include flags
        run: python build_flags.py --env

      - name: Download Dependency Walker (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $depsDir = "$env:LOCALAPPDATA\Nuitka\dependencywalker"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null
          $zipPath = "$depsDir\depends.zip"
          if (-not (Test-Path "$depsDir\depends.exe")) {
            Write-Host "Downloading Dependency Walker..."
            Invoke-WebRequest -Uri "https://dependencywalker.com/depends22_x64.zip" -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $depsDir -Force
            Remove-Item $zipPath
          }
          Write-Host "Dependency Walker ready at: $depsDir"

      # Unix 用 --standalone：产物是「可执行文件 + 同目录依赖文件」，
      # npm 包的 bin/<platform>-<arch>/ 目录结构依赖这一点
      # --assume-yes-for-downloads：让 Nuitka 自动确认下载 ccache 等组件，避免交互卡死
      - name: Build with Nuitka (Unix)
        if: matrix.platform != 'windows'
        run: |
          python -m nuitka --standalone --follow-imports --assume-yes-for-downloads --output-filename=agent $NUITKA_INCLUDES agent.py 2>&1 | tee build.log

      # Windows 用 --onefile：单个自包含 exe，npm 包只需分发一个文件
      # 注意：PowerShell 不会对变量做单词切分，直接写 $env:NUITKA_INCLUDES
      # 会把整串参数当成一个参数传给 Nuitka（报 "failed to locate package"），
      # 因此必须先读成数组，再用 @flags 展开。
      # 完整依赖编译失败时回退到最小依赖集重试，保证至少能产出可用的 exe
      - name: Build with Nuitka (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = ""
          $flags = @()
          if (Test-Path nuitka_flags.txt) {
            $flags = @(Get-Content nuitka_flags.txt | Where-Object { $_.Trim() -ne "" })
          }
          Write-Host "=== 依赖参数（$($flags.Count) 个）==="
          $flags | ForEach-Object { Write-Host "  $_" }

          Write-Host "=== 尝试完整依赖编译 ==="
          @("y") | python -m nuitka --onefile --assume-yes-for-downloads --output-filename=agent.exe @flags agent.py 2>&1 | Tee-Object -FilePath nuitka-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== 完整依赖编译失败，回退到最小依赖集重试 ==="
            Write-Host "=== 完整依赖编译失败 ===" | Out-File -FilePath nuitka-build.log -Append
            @("y") | python -m nuitka --onefile --assume-yes-for-downloads --output-filename=agent.exe --include-package=openai agent.py 2>&1 | Tee-Object -FilePath nuitka-build.log -Append
          }
          exit $LASTEXITCODE

      # 产物验证：真正跑一次 --version，证明 openai 等依赖已正确打包
      # （仅看文件列表无法证明，因为 Nuitka 会把纯 Python 包编进可执行文件）
      - name: Verify build output (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "---- agent.dist 顶层内容 ----"
          ls agent.dist | head -20
          echo "---- 运行 --version ----"
          ./agent.dist/agent --version
          echo "exit code: $?"

      # Windows 上 onefile exe 首次运行需要解压到临时目录，可能因环境问题报错。
      # 这里不让校验失败阻断归档上传——即使 exe 有问题，也先把产物发出去，
      # 便于用户下载复现；同时把退出码和输出打印到日志里。
      - name: Verify build output (Windows)
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem agent.exe
          Write-Host "---- 运行 --version ----"
          .\agent.exe --version
          Write-Host "exit code: $LASTEXITCODE"

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $targetDir = "dist/bin/${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -Path agent.exe -Destination $targetDir
          Compress-Archive -Path $targetDir -DestinationPath "dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Get-ChildItem dist

      - name: Create archive (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          targetDir="dist/bin/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$targetDir"
          cp -r agent.dist/* "$targetDir/"
          tar -czf "dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist/bin "${{ matrix.platform }}-${{ matrix.arch }}"
          ls -lh dist

      # 上传用 GitHub CLI：
      # - Release 已由前置 job 建好，不会出现多个 job 抢建 Release
      # - --clobber 让重跑可以覆盖同名资产（幂等）
      # - 失败自动重试 3 次（网络/并发导致的偶发失败）
      - name: Upload Release Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          FILE="dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}"
          echo "上传 $FILE 到 Release $RELEASE_TAG"
          for i in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "$FILE" --clobber --repo "${{ github.repository }}" 2>&1 | tee upload.log; then
              echo "✅ 上传成功"
              exit 0
            fi
            echo "⚠️ 第 $i 次上传失败，10 秒后重试"
            sleep 10
          done
          echo "❌ 上传失败，日志如下："
          cat upload.log
          exit 1

      # 构建失败时把编译日志作为 Release 资产上传，便于排查（无需 GitHub 管理权限即可读取）
      - name: Upload build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for LOG in nuitka-build.log build.log upload.log; do
            if [ -f "$LOG" ]; then
              echo "上传日志 $LOG"
              gh release upload "$RELEASE_TAG" "$LOG" --clobber --repo "${{ github.repository }}" || \
                echo "⚠️ 日志 $LOG 上传失败"
            fi
          done
