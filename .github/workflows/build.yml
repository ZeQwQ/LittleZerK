name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传二进制的 Release 标签，例如 v0.5.4'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 是 Apple Silicon，Intel 需要用不带 -arm64 后缀的标签
          # （macos-13 已下线，现存 macos-14 / macos-15 / macos-26 均为 Intel）
          - os: macos-15
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade nuitka ordered-set zstandard inflate64

      # 依赖包名各环境可能不同（httpx/httpx2 等），运行时探测再生成编译参数
      - name: Prepare Nuitka include flags
        run: python build_flags.py --env

      - name: Download Dependency Walker (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $depsDir = "$env:LOCALAPPDATA\Nuitka\dependencywalker"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null
          $zipPath = "$depsDir\depends.zip"
          if (-not (Test-Path "$depsDir\depends.exe")) {
            Write-Host "Downloading Dependency Walker..."
            Invoke-WebRequest -Uri "https://dependencywalker.com/depends22_x64.zip" -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $depsDir -Force
            Remove-Item $zipPath
          }
          Write-Host "Dependency Walker ready at: $depsDir"

      # Unix 用 --standalone：产物是「可执行文件 + 同目录依赖文件」，
      # npm 包的 bin/<platform>-<arch>/ 目录结构依赖这一点
      # --assume-yes-for-downloads：让 Nuitka 自动确认下载 ccache 等组件，避免交互卡死
      - name: Build with Nuitka (Unix)
        if: matrix.platform != 'windows'
        run: |
          python -m nuitka --standalone --follow-imports --assume-yes-for-downloads --output-filename=agent $NUITKA_INCLUDES agent.py

      # Windows 用 --onefile：单个自包含 exe，npm 包只需分发一个文件
      - name: Build with Nuitka (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = ""
          @("y") | python -m nuitka --onefile --follow-imports --assume-yes-for-downloads --output-filename=agent.exe $env:NUITKA_INCLUDES agent.py

      # 产物验证：真正跑一次 --version，证明 openai 等依赖已正确打包
      # （仅看文件列表无法证明，因为 Nuitka 会把纯 Python 包编进可执行文件）
      - name: Verify build output (Unix)
        if: matrix.platform != 'windows'
        run: |
          echo "---- agent.dist 顶层内容 ----"
          ls agent.dist | head -20
          echo "---- 运行 --version ----"
          ./agent.dist/agent --version

      - name: Verify build output (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem agent.exe
          Write-Host "---- 运行 --version ----"
          .\agent.exe --version

      - name: Create archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $targetDir = "dist/bin/${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -Path agent.exe -Destination $targetDir
          Compress-Archive -Path $targetDir -DestinationPath "dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Get-ChildItem dist

      - name: Create archive (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          targetDir="dist/bin/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$targetDir"
          cp -r agent.dist/* "$targetDir/"
          tar -czf "dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist/bin "${{ matrix.platform }}-${{ matrix.arch }}"
          ls -lh dist

      # 上传步骤按平台拆分：每个平台只产出一种压缩包，
      # 配合 fail_on_unmatched_files 才能真正暴露产物缺失
      - name: Upload Release Asset (Unix)
        if: matrix.platform != 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Release Asset (Windows)
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/littlezerk-${{ matrix.platform }}-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
